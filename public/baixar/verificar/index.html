<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Verificação</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src https://challenges.cloudflare.com; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<style>
:root{--teal:#0D7C7C;--ink:#1A1A1A;--ink2:#4A4A4A;--page:#F5F2EE}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--page);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;text-align:center}
main{max-width:420px;display:grid;gap:16px;justify-items:center}
h1{margin:0;font-size:1.3rem}
p{margin:0;color:var(--ink2)}
a{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border-radius:14px;background:var(--teal);color:#fff;font-weight:700;text-decoration:none}
a:focus-visible{outline:3px solid #C97D2A;outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1 id="t">Só um instante</h1>
  <p id="msg">Estamos confirmando que você é uma pessoa.</p>
  <div id="widget"></div>
  <a id="voltar" href="#" hidden>Voltar ao app</a>
</main>
<script>
(function () {
  'use strict';
  // Página do desafio Cloudflare Turnstile do cadastro do app. Recebe ?sitekey=...&retorno=vivegostoso://turnstile e devolve ?token=... ao app.
  var q = new URLSearchParams(location.search);
  var chave = q.get('sitekey') || '';
  var retorno = q.get('retorno') || '';
  var $ = function (id) { return document.getElementById(id); };
  function parar(msg) { $('t').textContent = 'Não deu para verificar'; $('msg').textContent = msg; }
  // Só devolve para o app (esquema próprio): nunca para outro endereço qualquer (sem redirecionamento aberto).
  var retornoOk = /^vivegostoso:\/\/turnstile(\?[^#\s]*)?$/.test(retorno);
  var chaveOk = /^[0-9][xA-Za-z][A-Za-z0-9_-]{18,}$/.test(chave);
  if (!retornoOk || !chaveOk) { parar('O link da verificação está incompleto. Volte ao app e tente de novo.'); return; }
  var voltar = $('voltar');
  function devolver(token) {
    var destino = retorno + (retorno.indexOf('?') >= 0 ? '&' : '?') + 'token=' + encodeURIComponent(token);
    voltar.href = destino; voltar.hidden = false;
    $('t').textContent = 'Pronto'; $('msg').textContent = 'Voltando para o app...';
    location.href = destino;
  }
  // Beta (25/11/2026): o desafio nunca trava o cadastro. O widget erra na primeira tentativa em aparelho de pouca confianca (emulador, celular com VPN ou
  // navegador desatualizado) e depois se recupera sozinho ou pede uma caixa para tocar. Por isso o erro NAO encerra a pagina na hora:
  // o widget repete, a pessoa ve o aviso para tocar na caixa, e so depois do prazo a pagina devolve ao app o marcador "sem-verificacao:<codigo>".
  // O servidor (verificar-turnstile) em modo observa deixa passar e registra; com TURNSTILE_EXIGIR=1 esse marcador e recusado (token invalido).
  // Para endurecer de vez: ligar TURNSTILE_EXIGIR e tirar o PRAZO_MS abaixo (docs/auth/turnstile.md).
  var PRAZO_MS = 20000;      // erro persistente: depois disso devolve o marcador
  var PRAZO_FATAL_MS = 2500; // erro de configuracao (110xxx, 400xxx): nao se recupera, nao adianta esperar
  var ultimoCodigo = '';
  var terminou = false;
  var timer = null;
  function fim(token) { if (terminou) return; terminou = true; if (timer) clearTimeout(timer); devolver(token); }
  function marcador() { return 'sem-verificacao:' + (ultimoCodigo || 'prazo'); }
  var limite = Infinity; // instante (ms) em que a pagina desiste; so pode diminuir, para a repeticao do widget nao empurrar o prazo para sempre
  function armar(ms) {
    var quando = Date.now() + ms;
    if (quando >= limite) return;
    limite = quando;
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () { fim(marcador()); }, ms);
  }
  window.onTurnstileLoad = function () {
    window.turnstile.render('#widget', {
      sitekey: chave, action: 'cadastro', language: 'pt-br',
      retry: 'auto', 'retry-interval': 3000, 'refresh-expired': 'auto',
      callback: function (token) { fim(token); },
      'error-callback': function (codigo) {
        if (terminou) return true;
        ultimoCodigo = String(codigo || 'erro').slice(0, 12);
        $('t').textContent = 'Só um instante';
        $('msg').textContent = 'Tentando de novo. Se aparecer a caixa "Confirme que é humano", toque nela.';
        armar(/^(110|400)/.test(ultimoCodigo) ? PRAZO_FATAL_MS : PRAZO_MS);
        return true;
      },
      'expired-callback': function () { $('msg').textContent = 'Atualizando a verificação...'; }
    });
    armar(PRAZO_MS + 15000); // nem o widget respondeu (rede lenta): mesmo prazo, com folga
  };
  var s = document.createElement('script');
  s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit';
  s.async = true; s.defer = true;
  s.onerror = function () { ultimoCodigo = 'sem-rede'; armar(PRAZO_FATAL_MS); $('msg').textContent = 'Sem conexão com o serviço de verificação. Seguindo sem ela.'; };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
